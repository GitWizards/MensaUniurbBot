services:
  bot:
    container_name: MensaUniurbBot
    build: ./bot/
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  api:
    container_name: MensaUniurbApi
    build: ./api/
    env_file: .env
    environment:
      - DB_PATH=/app/data/mensa_requests.db
    ports:
      - 9543:9543
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
